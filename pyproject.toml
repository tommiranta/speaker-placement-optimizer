[project]
name = "room-mode-optimizer"
version = "0.1.0"
description = "Optimize speaker and listener placement to minimize room mode effects"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "numpy>=2.0",
    "scipy>=1.14",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
room-optimize = "room_mode_optimizer.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/room_mode_optimizer"]
